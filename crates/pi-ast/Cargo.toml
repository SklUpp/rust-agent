[package]
name = "pi-ast"
version.workspace = true
edition.workspace = true
license = "MIT"
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# The twelve core grammars every build links.
core-grammars = [
	"dep:tree-sitter-bash",
	"dep:tree-sitter-c",
	"dep:tree-sitter-cpp",
	"dep:tree-sitter-go",
	"dep:tree-sitter-javascript",
	"dep:tree-sitter-json",
	"dep:tree-sitter-md",
	"dep:tree-sitter-python",
	"dep:tree-sitter-rust",
	"dep:tree-sitter-toml-ng",
	"dep:tree-sitter-typescript",
	"dep:tree-sitter-yaml",
]
# Every remaining grammar. `default` keeps it on so every `SupportLang`
# variant parses; a slim build drops it:
# `pi-ast = { path = "...", default-features = false, features = ["core-grammars"] }`.
# Compiled-out variants still exist and still compile downstream match arms,
# but parsing one panics (see `SupportLang::is_available`).
full-grammars = [
	"core-grammars",
	"dep:tree-sitter-astro",
	"dep:tree-sitter-clojure",
	"dep:tree-sitter-cmake",
	"dep:tree-sitter-c-sharp",
	"dep:tree-sitter-css",
	"dep:tree-sitter-dart",
	"dep:tree-sitter-diff",
	"dep:tree-sitter-dockerfile",
	"dep:tree-sitter-elisp",
	"dep:tree-sitter-elixir",
	"dep:tree-sitter-erlang",
	"dep:tree-sitter-fortran",
	"dep:tree-sitter-graphql",
	"dep:tree-sitter-haskell",
	"dep:tree-sitter-hcl",
	"dep:tree-sitter-html",
	"dep:tree-sitter-ini",
	"dep:tree-sitter-java",
	"dep:tree-sitter-julia",
	"dep:tree-sitter-just",
	"dep:tree-sitter-kotlin",
	"dep:tree-sitter-lua",
	"dep:tree-sitter-make",
	"dep:tree-sitter-nix",
	"dep:tree-sitter-objc",
	"dep:tree-sitter-ocaml",
	"dep:tree-sitter-odin",
	"dep:tree-sitter-php",
	"dep:tree-sitter-powershell",
	"dep:tree-sitter-proto",
	"dep:tree-sitter-r",
	"dep:tree-sitter-regex",
	"dep:tree-sitter-ruby",
	"dep:tree-sitter-scala",
	"dep:tree-sitter-solidity",
	"dep:tree-sitter-sql",
	"dep:tree-sitter-starlark",
	"dep:tree-sitter-svelte",
	"dep:tree-sitter-swift",
	"dep:tree-sitter-tlaplus",
	"dep:tree-sitter-verilog",
	"dep:tree-sitter-vue",
	"dep:tree-sitter-xml",
	"dep:tree-sitter-zig",
]
default = ["core-grammars", "full-grammars"]

