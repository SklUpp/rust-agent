[package]
name = "aragent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "aragent"
path = "src/lib.rs"

[[bin]]
name = "arag"
path = "src/main.rs"

[dependencies]
# No YAML crate: config.yml/models.yml are read by the in-tree subset parser in
# `src/yaml.rs` so the binary keeps a small, offline-buildable dependency set and
# avoids the archived `serde_yaml`.
async-trait.workspace = true
# Same version the lock already resolves (via grep-searcher/regex), so exact
# credential matching adds no new crate to the build.
aho-corasick = "1.1.5"
base64.workspace = true
clap.workspace = true
# Opt-in local embeddings; onnxruntime is loaded dynamically at runtime.
fastembed = { workspace = true, optional = true }
flate2 = "1.1"
globset.workspace = true
grep-searcher.workspace = true
libc.workspace = true
pi-agent = { path = "../pi-agent" }
pi-ast = { path = "../pi-ast" }
pi-grep-pattern = { path = "../pi-grep-pattern" }
pi-walker.workspace = true
reqwest = { workspace = true }
rustls = { workspace = true }
serde.workspace = true
serde_json.workspace = true
# Pinned: the lock already resolves sha2 0.10.9 and 0.11.0; auth parity uses 0.10.
sha2 = "0.10.9"
rusqlite = { version = "0.33.0", features = ["bundled"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "fs", "io-util", "sync", "macros"] }
tokio-util.workspace = true
# Same crate and version the native lock names its abstract socket with.
xxhash-rust.workspace = true

[features]
default = []
local-embeddings = ["dep:fastembed"]
test-support = ["pi-agent/test-support"]

[dev-dependencies]
clap.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["full"] }
