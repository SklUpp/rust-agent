[package]
name = "pi-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["full"] }
flume = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
regex = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
pi-shell = { workspace = true }
pi-walker = { workspace = true }
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
pi-iso = { workspace = true }
pi-vcs.workspace = true
ruzstd.workspace = true
xutf.workspace = true
pi-ast = { workspace = true }
portable-pty = { workspace = true }
xxhash-rust = { workspace = true }
webpki-roots = { workspace = true }
similar = { workspace = true }
# Same package/version as `aragent`; `hooks` enables the read-only authorizer.
rusqlite = { version = "0.33.0", features = ["bundled", "hooks"] }

[features]
default = []
test-support = ["rmcp/test-support"]
# Embed the non-default utok vocabularies (cl100k_base, qwen3, deepseek3,
# kimi_k2, glm5; ~3.4 MB compressed). Default builds embed o200k_base and the
# two Claude ctok blobs only.
utok-all-families = []
# Opt-in direct provider adapters (`provider_anthropic`, `provider_ollama`).
# Default builds keep only the OpenAI-compatible adapter.
direct-providers = []

[dev-dependencies]
fancy-regex = "0.17" # utok scanner differential oracle
tokio = { workspace = true, features = ["full"] }
futures = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
rusqlite = { version = "0.33.0", features = ["bundled", "hooks"] }
