# cargo-about 0.8.2 resolves OR expressions in this priority order. The
# generated notice therefore chooses a permissive branch where one exists,
# while cargo-deny's clarifications retain every AND obligation.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    # webpki-roots and webpki-root-certs ship the CA bundle under CDLA.
    "CDLA-Permissive-2.0",
]

# Package-scoped reviews. No copyleft license is globally accepted.

# terminfo is pulled by the vendored brush-core on unix terminals.
[terminfo]
accepted = ["WTFPL"]

# uluru (via gix -> gix-pack's static LRU pack cache) is MPL-2.0: file-level
# copyleft satisfied by upstream source availability; our use is unmodified.
[uluru]
accepted = ["MPL-2.0"]

[tree-sitter-graphql.clarify]
license = "MIT"

[[tree-sitter-graphql.clarify.files]]
path = "LICENSE"
