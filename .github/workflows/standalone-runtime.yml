name: Standalone runtime

# Host check/test/smoke plus the Android arm64 (bionic) build. Bun/Node stay
# absent: this workflow proves the Rust runtime builds and runs on its own.
# The Android binary still links C dependencies from the NDK (ring/cc-rs); it is
# statically linked Android arm64, not a claim of pure-Rust dependencies.
on:
  push:
    branches: [main, feat/standalone-runtime]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: standalone-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2026-08-08
  NDK_VERSION: r27c
  ANDROID_API: "24"

jobs:
  test-host:
    name: Host check, tests and CLI smoke (linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain "$RUST_TOOLCHAIN" --profile minimal
            . "$HOME/.cargo/env"
          fi
          if ! rustc +"$RUST_TOOLCHAIN" --version >/dev/null 2>&1; then
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          fi
          rustup default "$RUST_TOOLCHAIN"
          toolchain_bin="$(dirname "$(rustup which cargo --toolchain "$RUST_TOOLCHAIN")")"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
          echo "Using Rust toolchain: $(rustc +"$RUST_TOOLCHAIN" --version)"
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: standalone-runtime-host
      - name: Check agent core and CLI
        run: cargo check --locked -p pi-agent -p omp-cli
      - name: Test agent core and CLI
        run: cargo test --locked -p pi-agent -p omp-cli
      - name: Build CLI for the smoke run
        run: cargo build --locked -p omp-cli
      - name: Run real CLI against local OpenAI-compatible fixture
        run: python3 scripts/standalone-smoke.py --binary target/debug/omp --timeout 120
      - name: Record host binary digest
        run: sha256sum target/debug/omp > target/debug/omp.sha256
      - name: Upload host binary
        uses: actions/upload-artifact@v4
        with:
          name: omp-x86_64-unknown-linux-gnu
          path: |
            target/debug/omp
            target/debug/omp.sha256
          if-no-files-found: error

  build-android:
    name: Android arm64 binary (bionic)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain with Android target
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain "$RUST_TOOLCHAIN" --profile minimal
            . "$HOME/.cargo/env"
          fi
          if ! rustc +"$RUST_TOOLCHAIN" --version >/dev/null 2>&1; then
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          fi
          rustup default "$RUST_TOOLCHAIN"
          if ! rustup target list --toolchain "$RUST_TOOLCHAIN" --installed \
            | grep -qx aarch64-linux-android; then
            rustup target add --toolchain "$RUST_TOOLCHAIN" aarch64-linux-android
          fi
          toolchain_bin="$(dirname "$(rustup which cargo --toolchain "$RUST_TOOLCHAIN")")"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
          echo "Using Rust toolchain: $(rustc +"$RUST_TOOLCHAIN" --version)"
      - name: Install NDK ${{ env.NDK_VERSION }}
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: standalone-runtime-android
      - name: Build omp for aarch64-linux-android
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          API="$ANDROID_API"
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android${API}-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$AR_aarch64_linux_android"
          # ring and other cc-rs consumers read the unprefixed target vars.
          export TARGET_CC="$CC_aarch64_linux_android"
          export TARGET_AR="$AR_aarch64_linux_android"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C opt-level=3 -C debuginfo=0 -C strip=symbols"
          cargo build --release --locked -p omp-cli --target aarch64-linux-android
          BIN="target/aarch64-linux-android/release/omp"
          "$TOOLCHAIN/llvm-strip" "$BIN"
          file -b "$BIN" | tee /dev/stderr | grep -q 'ELF 64-bit.*aarch64'
          ls -lh "$BIN"
          sha256sum "$BIN" > "$BIN.sha256"
      - name: Upload Android binary
        uses: actions/upload-artifact@v4
        with:
          name: omp-aarch64-linux-android
          path: |
            target/aarch64-linux-android/release/omp
            target/aarch64-linux-android/release/omp.sha256
          if-no-files-found: error
