name: Standalone runtime

# Host check/test/smoke plus the Android arm64 (bionic) build. Bun/Node stay
# absent: this workflow proves the Rust runtime builds and runs on its own.
# The Android binary still links C dependencies from the NDK (ring/cc-rs); it is
# statically linked Android arm64, not a claim of pure-Rust dependencies.
on:
  push:
    branches: [main, feat/standalone-runtime]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_patch_lock:
        description: Refresh patch versions of rustls/rustls-webpki/tokio/url/rustix in Cargo.lock
        required: false
        type: boolean
        default: false

concurrency:
  group: standalone-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2026-08-08
  NDK_VERSION: r27c
  ANDROID_API: "24"

jobs:
  test-host:
    name: Host check, tests and CLI smoke (linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain "$RUST_TOOLCHAIN" --profile minimal
            . "$HOME/.cargo/env"
          fi
          if ! rustc +"$RUST_TOOLCHAIN" --version >/dev/null 2>&1; then
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          fi
          rustup default "$RUST_TOOLCHAIN"
          toolchain_bin="$(dirname "$(rustup which cargo --toolchain "$RUST_TOOLCHAIN")")"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
          echo "Using Rust toolchain: $(rustc +"$RUST_TOOLCHAIN" --version)"
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: standalone-runtime-host
      - name: Refresh patch-level security crates in Cargo.lock (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_patch_lock
        run: |
          cargo update -p rustls -p rustls-webpki -p tokio -p rustix
          cargo update --ignore-rust-version -p url -p form_urlencoded
      - name: Check agent core and CLI
        run: cargo check --locked -p pi-agent -p aragent
      - name: Test agent core and CLI
        run: cargo test --locked -p pi-agent -p aragent
      - name: Check opt-in local embeddings feature
        run: cargo check --locked -p aragent --features local-embeddings
      - name: Test in-process git backend
        run: cargo test --locked -p pi-vcs
      - name: Check MCP smoke test support
        run: cargo test --locked -p aragent --features test-support --test mcp_filesystem_smoke
      - name: Test persistent shell session, env allowlist, policy, and tree kill
        run: cargo test --locked -p pi-shell --lib policy --test persistent_session --test session_env_allowlist --test process_tree_kill
      - name: Build CLI for the smoke run
        run: cargo build --locked -p aragent
      - name: Run real CLI against local OpenAI-compatible fixture
        run: python3 scripts/standalone-smoke.py --binary target/debug/arag --timeout 120
      - name: Record host binary digest
        run: sha256sum target/debug/arag > target/debug/arag.sha256
      - name: Upload host binary
        uses: actions/upload-artifact@v4
        with:
          name: arag-x86_64-unknown-linux-gnu
          path: |
            target/debug/arag
            target/debug/arag.sha256
          if-no-files-found: error

  build-android:
    name: Android arm64 binary (bionic)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain with Android target
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain "$RUST_TOOLCHAIN" --profile minimal
            . "$HOME/.cargo/env"
          fi
          if ! rustc +"$RUST_TOOLCHAIN" --version >/dev/null 2>&1; then
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          fi
          rustup default "$RUST_TOOLCHAIN"
          if ! rustup target list --toolchain "$RUST_TOOLCHAIN" --installed \
            | grep -qx aarch64-linux-android; then
            rustup target add --toolchain "$RUST_TOOLCHAIN" aarch64-linux-android
          fi
          toolchain_bin="$(dirname "$(rustup which cargo --toolchain "$RUST_TOOLCHAIN")")"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
          echo "Using Rust toolchain: $(rustc +"$RUST_TOOLCHAIN" --version)"
      - name: Install NDK ${{ env.NDK_VERSION }}
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: standalone-runtime-android
      - name: Refresh patch-level security crates in Cargo.lock (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_patch_lock
        run: |
          cargo update -p rustls -p rustls-webpki -p tokio -p rustix
          cargo update --ignore-rust-version -p url -p form_urlencoded
      - name: Build arag for aarch64-linux-android
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          API="$ANDROID_API"
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android${API}-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$AR_aarch64_linux_android"
          # ring and other cc-rs consumers read the unprefixed target vars.
          export TARGET_CC="$CC_aarch64_linux_android"
          export TARGET_AR="$AR_aarch64_linux_android"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C opt-level=3 -C debuginfo=0 -C strip=symbols"
          # Opt-in feature must compile for bionic too; ort loads libonnxruntime
          # dynamically at runtime, so no native ONNX library is linked here.
          cargo check --locked -p aragent --target aarch64-linux-android --features local-embeddings
          cargo build --release --locked -p aragent --target aarch64-linux-android
          BIN="target/aarch64-linux-android/release/arag"
          "$TOOLCHAIN/llvm-strip" "$BIN"
          file -b "$BIN" | tee /dev/stderr | grep -q 'ELF 64-bit.*aarch64'
          ls -lh "$BIN"
          sha256sum "$BIN" > "$BIN.sha256"
      - name: Upload Android binary
        uses: actions/upload-artifact@v4
        with:
          name: arag-aarch64-linux-android
          path: |
            target/aarch64-linux-android/release/arag
            target/aarch64-linux-android/release/arag.sha256
          if-no-files-found: error

  license-notices:
    name: License policy and third-party notices
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Metadata-only run: keep rustup from installing the pinned nightly just to
    # answer `cargo metadata`.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny and cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.8.2
      - name: Refresh patch-level security crates in Cargo.lock (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_patch_lock
        run: |
          cargo update -p rustls -p rustls-webpki -p tokio -p rustix
          cargo update --ignore-rust-version -p url -p form_urlencoded
      - name: Check advisories, licenses, and sources
        run: cargo deny check
      - name: Generate dependency license data
        run: |
          set -euo pipefail
          mkdir -p target/about
          cargo about generate --fail --locked --workspace --all-features --format json \
            --output-file target/about/licenses.json
      - name: Assemble THIRD-PARTY-NOTICES.generated.txt
        run: |
          set -euo pipefail
          python3 - target/about/licenses.json THIRD-PARTY-NOTICES.generated.txt <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          out = Path(sys.argv[2])
          overview = data.get("overview", [])
          licenses = data.get("licenses", [])

          lines = []

          def rule(title):
              lines.extend(["", "=" * 78, title, "=" * 78, ""])

          def read(path):
              return Path(path).read_text(encoding="utf-8").strip("\n")

          lines.extend(
              [
                  "THIRD-PARTY NOTICES",
                  "===================",
                  "",
                  "Generated for the rust-agent workspace by",
                  "`cargo about generate --locked --workspace --all-features --format json`",
                  "and `cargo deny check` (policy: about.toml / deny.toml).",
              ]
          )

          rule("Project license: MIT (LICENSE)")
          lines.append(read("LICENSE"))

          rule("Vendored rmcp 3.9.0: Apache-2.0 (crates/vendor/rmcp/LICENSE)")
          lines.append(read("crates/vendor/rmcp/LICENSE"))

          rule("Vendored brush-core 0.5.0: MIT (crates/vendor/brush-core/LICENSE)")
          lines.append(read("crates/vendor/brush-core/LICENSE"))

          rule("In-tree third-party builtins attribution (crates/pi-builtins/LICENSE)")
          lines.append(read("crates/pi-builtins/LICENSE"))

          rule("In-tree shell minimizer attribution (crates/pi-shell/NOTICE)")
          lines.append(read("crates/pi-shell/NOTICE"))

          rule("Dependency license overview")
          for entry in sorted(overview, key=lambda e: (e.get("id", ""), e.get("name", ""))):
              lines.append(
                  f"  {entry.get('id', '?')} ({entry.get('name', '?')}): "
                  f"{entry.get('count', 0)} crate(s)"
              )

          rule("License texts and attribution")
          for item in licenses:
              used_by = sorted(
                  {
                      f"{(u.get('crate') or {}).get('name', '?')} "
                      f"{(u.get('crate') or {}).get('version', '?')}"
                      for u in item.get("used_by", [])
                      if u.get("crate")
                  }
              )
              lines.extend(
                  [
                      "-" * 78,
                      f"{item.get('id', '?')}: {item.get('name', '?')}",
                  ]
              )
              if item.get("source_path"):
                  lines.append(f"Source: {item['source_path']}")
              lines.append(f"Used by ({len(used_by)}): {', '.join(used_by)}")
              lines.extend(["", (item.get("text") or "").strip("\n"), ""])

          out.write_text("\n".join(lines).rstrip("\n") + "\n", encoding="utf-8")
          PY
      - name: Upload third-party notices
        uses: actions/upload-artifact@v4
        with:
          name: third-party-notices
          path: THIRD-PARTY-NOTICES.generated.txt
          if-no-files-found: error
      - name: Upload refreshed Cargo.lock (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_patch_lock
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
