release:
  version: "0.2.0-dev"
  codename: "Transport & Durable Runtime"
  status: in_progress
  semantic_release: false
  bump_hint: minor

work_order_and_dependencies:
  ordering_rules:
    - "R0.1–R0.4 are parallel tails of the 0.1.x line; R0.1, R0.2 and R0.3 are closed, R0.4 has a gated smoke test written (cf1e673) whose live Termux run is still pending (docs/agent-preliminary-implementation-plan.md:38,52)."
    - "R0 MUST precede R1: durable task admission relies on absence of unredacted dirty writers in same transactions (docs/agent-preliminary-implementation-plan.md:45)."
    - "R1 through R3 MUST execute sequentially: durable task relies on non-conflicting writers, and SQLITE_BUSY relies on absence of blind retries around commit (docs/agent-preliminary-implementation-plan.md:52)."
    - "R7 (parallel writers & merge) MUST NOT start before R2: without the SQLITE_BUSY statement boundary, concurrent commits cannot be proven (docs/agent-preliminary-implementation-plan.md:46)."
    - "R4 through R8 MAY execute in parallel only AFTER R3 is completed, provided worktrees and files are disjoint (docs/agent-preliminary-implementation-plan.md:52)."
    - "R9 and R10 MUST NOT start until R1 through R3 are proven on a live device (specs/product/SCOPE_LATEST.yaml:18; docs/agent-preliminary-implementation-plan.md:52)."
    - "Versioning and releases: prerelease chain (-dev, -alpha, -beta) and CI builds distinguish builds during ongoing implementation; MAJOR version remains 0 until R7 closes, and stable 0.2.0 release is not declared before R7 completion (docs/agent-preliminary-implementation-plan.md:36,65)."

