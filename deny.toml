# cargo-deny 0.20.2 policy. Empty targets evaluates every target-specific
# dependency represented by Cargo.lock; all-features includes optional edges.
[graph]
targets = []
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Unmaintained crate with no safe upstream replacement in Cargo.lock.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained upstream with no drop-in patch release yet" },
    # Unmaintained proc-macro dependency pulled transitively; compile-time only.
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained transitive macro-only dependency; no runtime surface" },
    # Bundled SQLite < 3.54.0 -wal page-size bug requires major rusqlite 0.33 -> 0.41 upgrade.
    { id = "RUSTSEC-2026-0459", reason = "aragent opens only local 0700/0600 SQLite DBs; major rusqlite 0.41 upgrade tracked separately" },
]

[licenses]
version = 2
include-dev = true
include-build = true
unused-allowed-license = "deny"
unused-license-exception = "deny"
confidence-threshold = 0.8
# cargo-deny evaluates SPDX expressions existentially across OR and
# conjunctively across AND: a permissive OR branch may be selected, but every
# obligation in the selected branch must be allowed.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # webpki-roots and webpki-root-certs ship the CA bundle under CDLA.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# Every license above is reachable in the current lock: 0BSD (adler2),
# BSL-1.0 (xxhash-rust), CC0-1.0 (notify), CDLA (webpki roots), Unicode-3.0
# (icu/fixed_decimal), Zlib (zlib-rs, foldhash). Keep unused-allowed-license
# strict so a dropped dependency removes its stale allowance.
exceptions = [
    # terminfo is pulled by the vendored brush-core on unix terminals.
    { allow = ["WTFPL"], crate = "terminfo@0.9.0" },
    # uluru (via gix -> gix-pack) is MPL-2.0: file-level copyleft, satisfied
    # by upstream source availability; no obligations attach to our
    # unmodified use. Keep it package-scoped.
    { allow = ["MPL-2.0"], crate = "uluru@3.1.0" },
    # option-ext (via fastembed -> hf-hub -> dirs -> dirs-sys) is MPL-2.0.
    { allow = ["MPL-2.0"], crate = "option-ext@0.2.0" },
]

# tree-sitter-graphql 0.1.0 has no SPDX expression in Cargo.toml. Its packaged
# LICENSE is MIT; cargo-about pins the exact license-file checksum.
[[licenses.clarify]]
crate = "tree-sitter-graphql@0.1.0"
expression = "MIT"
license-files = [
    { path = "LICENSE", hash = 0xda88ff2a },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
# brush-core and rmcp are [patch.crates-io] path overrides, not registry or
# git sources; path dependencies bypass this check and are audited in-tree.
